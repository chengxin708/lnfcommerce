<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>番茄钟 · LNF Commerce</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍅</text></svg>" />
  <link rel="stylesheet" href="../assets/css/style.css" />
  <style>
    .timer-wrap { display: flex; flex-direction: column; align-items: center; gap: 20px; padding: 16px 0; width: 100%; }
    .ring { position: relative; width: min(80vw, 300px); aspect-ratio: 1; }
    .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .ring circle { fill: none; stroke-width: 10; }
    .ring .track { stroke: var(--border); }
    .ring .bar { stroke: #ff5c7a; stroke-linecap: round; transition: stroke-dashoffset 0.5s linear, stroke 0.3s; }
    .ring .label { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
    .ring .clock { font-size: clamp(44px, 14vw, 64px); font-weight: 800; font-variant-numeric: tabular-nums; }
    .ring .mode { color: var(--muted); }
    .modes { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    .tomatoes { font-size: 22px; min-height: 30px; letter-spacing: 2px; text-align: center; }
  </style>
</head>
<body class="play-page">
  <header class="nav">
    <div class="container nav-inner">
      <a href="../index.html" class="logo"><span class="logo-mark">LNF</span><span class="logo-text">LNF Commerce</span></a>
      <div class="nav-actions">
        <a class="btn btn-ghost btn-sm" href="../index.html#catalog-section">← 返回作品库</a>
        <button class="icon-btn" id="themeBtn" aria-label="切换主题">☀️</button>
      </div>
    </div>
  </header>

  <main class="play-main">
    <div class="container">
      <div class="play-head">
        <div><h1>🍅 番茄钟</h1><p>专注一段，休息一下，循环往复。</p></div>
        <div class="scoreboard"><div class="score"><small>今日番茄</small><b id="count">0</b></div></div>
      </div>
      <div class="stage">
        <div class="timer-wrap">
          <div class="modes">
            <button class="chip active" data-mode="focus">专注 25′</button>
            <button class="chip" data-mode="short">短休 5′</button>
            <button class="chip" data-mode="long">长休 15′</button>
          </div>
          <div class="ring">
            <svg viewBox="0 0 120 120">
              <circle class="track" cx="60" cy="60" r="52" />
              <circle class="bar" id="bar" cx="60" cy="60" r="52" />
            </svg>
            <div class="label"><div class="clock" id="clock">25:00</div><div class="mode" id="modeText">专注中</div></div>
          </div>
          <div class="controls" style="margin:0">
            <button class="btn btn-primary" id="toggleBtn">开始</button>
            <button class="btn btn-ghost" id="resetBtn">重置</button>
          </div>
          <div class="tomatoes" id="tomatoes"></div>
        </div>
      </div>
      <p class="help">每完成 4 个番茄建议来一次长休息 · 计时结束会有提示音</p>
    </div>
  </main>

  <script src="../assets/js/main.js"></script>
  <script>
    (function () {
      const MODES = {
        focus: { min: 25, text: "专注中", color: "#ff5c7a" },
        short: { min: 5, text: "短暂休息", color: "#20d3c2" },
        long: { min: 15, text: "长休息", color: "#7c5cff" },
      };
      const C = 2 * Math.PI * 52;
      const bar = document.getElementById("bar");
      const clock = document.getElementById("clock");
      const modeText = document.getElementById("modeText");
      const toggleBtn = document.getElementById("toggleBtn");
      const countEl = document.getElementById("count");
      const tomatoesEl = document.getElementById("tomatoes");
      bar.style.strokeDasharray = C;

      const today = new Date().toDateString();
      let stats = {};
      try { stats = JSON.parse(LNF.store.get("lnf-pomodoro") || "{}"); } catch (e) { stats = {}; }
      if (stats.day !== today) stats = { day: today, count: 0 };

      let mode = "focus", total, endAt = 0, remaining, timer = null;

      function showCount() {
        countEl.textContent = stats.count;
        tomatoesEl.textContent = "🍅".repeat(Math.min(stats.count, 12)) + (stats.count > 12 ? ` +${stats.count - 12}` : "");
      }

      function setMode(m) {
        stop();
        mode = m;
        total = remaining = MODES[m].min * 60;
        bar.style.stroke = MODES[m].color;
        modeText.textContent = MODES[m].text;
        document.querySelectorAll("[data-mode]").forEach((c) => c.classList.toggle("active", c.dataset.mode === m));
        paint();
      }

      function paint() {
        const s = Math.max(0, Math.ceil(remaining));
        const txt = `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`;
        clock.textContent = txt;
        document.title = `${txt} · ${MODES[mode].text}`;
        bar.style.strokeDashoffset = C * (1 - remaining / total);
      }

      function beep() {
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          [0, 0.25, 0.5].forEach((t) => {
            const o = ctx.createOscillator();
            const g = ctx.createGain();
            o.frequency.value = 880;
            o.connect(g); g.connect(ctx.destination);
            g.gain.setValueAtTime(0.2, ctx.currentTime + t);
            g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + t + 0.2);
            o.start(ctx.currentTime + t);
            o.stop(ctx.currentTime + t + 0.2);
          });
        } catch (e) { /* 浏览器不支持音频时忽略 */ }
      }

      function loop() {
        // 用结束时间戳计算，切到后台标签页也不会走慢
        remaining = (endAt - Date.now()) / 1000;
        if (remaining <= 0) {
          remaining = 0;
          paint();
          stop();
          beep();
          if (mode === "focus") {
            stats.count++;
            LNF.store.set("lnf-pomodoro", JSON.stringify(stats));
            showCount();
            LNF.toast("🍅 完成一个番茄！休息一下吧");
            setMode(stats.count % 4 === 0 ? "long" : "short");
          } else {
            LNF.toast("☕ 休息结束，开始下一轮专注");
            setMode("focus");
          }
          return;
        }
        paint();
      }

      function start() {
        endAt = Date.now() + remaining * 1000;
        timer = setInterval(loop, 250);
        toggleBtn.textContent = "暂停";
      }

      function stop() {
        clearInterval(timer);
        timer = null;
        toggleBtn.textContent = "开始";
      }

      toggleBtn.addEventListener("click", () => (timer ? stop() : start()));
      document.getElementById("resetBtn").addEventListener("click", () => setMode(mode));
      document.querySelectorAll("[data-mode]").forEach((c) => c.addEventListener("click", () => setMode(c.dataset.mode)));

      showCount();
      setMode("focus");
    })();
  </script>
</body>
</html>
