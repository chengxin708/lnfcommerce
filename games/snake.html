<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>贪吃蛇 Neo · LNF Commerce</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐍</text></svg>" />
  <link rel="stylesheet" href="../assets/css/style.css" />
  <style>
    canvas { width: min(100%, 480px); aspect-ratio: 1; border-radius: 12px; background: #0a0f1c; touch-action: none; }
  </style>
</head>
<body class="play-page">
  <header class="nav">
    <div class="container nav-inner">
      <a href="../index.html" class="logo"><span class="logo-mark">LNF</span><span class="logo-text">LNF Commerce</span></a>
      <div class="nav-actions">
        <a class="btn btn-ghost btn-sm" href="../index.html#catalog-section">← 返回作品库</a>
        <button class="icon-btn" id="themeBtn" aria-label="切换主题">☀️</button>
      </div>
    </div>
  </header>

  <main class="play-main">
    <div class="container">
      <div class="play-head">
        <div><h1>🐍 贪吃蛇 Neo</h1><p>吃掉能量球变长，别撞墙也别咬到自己。</p></div>
        <div class="scoreboard">
          <div class="score"><small>得分</small><b id="score">0</b></div>
          <div class="score"><small>最高</small><b id="best">0</b></div>
        </div>
      </div>
      <div class="stage"><canvas id="board" width="480" height="480"></canvas></div>
      <div class="controls">
        <button class="btn btn-primary" id="startBtn">开始游戏</button>
        <button class="btn btn-ghost" id="pauseBtn">暂停</button>
      </div>
      <p class="help">电脑：方向键 / WASD 控制，空格暂停 · 手机：在画面上滑动控制方向</p>
    </div>
  </main>

  <script src="../assets/js/main.js"></script>
  <script>
    (function () {
      const N = 20; // 网格数量
      const canvas = document.getElementById("board");
      const ctx = canvas.getContext("2d");
      const S = canvas.width / N;
      const scoreEl = document.getElementById("score");
      const bestEl = document.getElementById("best");
      const startBtn = document.getElementById("startBtn");
      const pauseBtn = document.getElementById("pauseBtn");

      let snake, dir, nextDir, food, score, timer, running, paused;
      let best = Number(LNF.store.get("lnf-snake-best") || 0);
      bestEl.textContent = best;

      function reset() {
        snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
        dir = { x: 1, y: 0 };
        nextDir = dir;
        score = 0;
        scoreEl.textContent = 0;
        placeFood();
      }

      function placeFood() {
        do {
          food = { x: Math.floor(Math.random() * N), y: Math.floor(Math.random() * N) };
        } while (snake.some((p) => p.x === food.x && p.y === food.y));
      }

      function speed() { return Math.max(60, 140 - score * 3); }

      function tick() {
        dir = nextDir;
        const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
        const hitWall = head.x < 0 || head.y < 0 || head.x >= N || head.y >= N;
        const ate = head.x === food.x && head.y === food.y;
        // 不吃东西时尾巴会移走，所以碰撞检测排除尾巴
        const body = ate ? snake : snake.slice(0, -1);
        if (hitWall || body.some((p) => p.x === head.x && p.y === head.y)) return gameOver();

        snake.unshift(head);
        if (ate) {
          score++;
          scoreEl.textContent = score;
          if (snake.length === N * N) return gameOver(true);
          placeFood();
        } else {
          snake.pop();
        }
        draw();
        timer = setTimeout(tick, speed());
      }

      function draw() {
        ctx.fillStyle = "#0a0f1c";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = "rgba(255,255,255,0.04)";
        for (let i = 1; i < N; i++) {
          ctx.beginPath(); ctx.moveTo(i * S, 0); ctx.lineTo(i * S, canvas.height); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(0, i * S); ctx.lineTo(canvas.width, i * S); ctx.stroke();
        }
        // 食物
        ctx.shadowBlur = 16;
        ctx.shadowColor = "#ff5c7a";
        ctx.fillStyle = "#ff5c7a";
        ctx.beginPath();
        ctx.arc(food.x * S + S / 2, food.y * S + S / 2, S / 2.6, 0, Math.PI * 2);
        ctx.fill();
        // 蛇
        ctx.shadowColor = "#20d3c2";
        snake.forEach((p, i) => {
          ctx.fillStyle = i === 0 ? "#7cffe9" : `hsl(${172 - i * 2}, 70%, ${55 - Math.min(i, 20)}%)`;
          ctx.fillRect(p.x * S + 2, p.y * S + 2, S - 4, S - 4);
        });
        ctx.shadowBlur = 0;
      }

      function overlay(text, sub) {
        draw();
        ctx.fillStyle = "rgba(5,8,16,0.7)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#fff";
        ctx.textAlign = "center";
        ctx.font = "bold 32px sans-serif";
        ctx.fillText(text, canvas.width / 2, canvas.height / 2 - 8);
        ctx.font = "16px sans-serif";
        ctx.fillStyle = "#9aa1bd";
        ctx.fillText(sub, canvas.width / 2, canvas.height / 2 + 26);
      }

      function gameOver(win) {
        running = false;
        clearTimeout(timer);
        if (score > best) {
          best = score;
          bestEl.textContent = best;
          LNF.store.set("lnf-snake-best", best);
        }
        overlay(win ? "你赢了！🎉" : "游戏结束", `得分 ${score} · 点击「开始游戏」再来一局`);
        startBtn.textContent = "再来一局";
      }

      function start() {
        clearTimeout(timer);
        reset();
        running = true;
        paused = false;
        pauseBtn.textContent = "暂停";
        startBtn.textContent = "重新开始";
        tick();
      }

      function togglePause() {
        if (!running) return;
        paused = !paused;
        pauseBtn.textContent = paused ? "继续" : "暂停";
        if (paused) { clearTimeout(timer); overlay("已暂停", "按空格或点击「继续」"); }
        else tick();
      }

      function turn(x, y) {
        // 禁止直接掉头
        if (x === -dir.x && y === -dir.y) return;
        nextDir = { x, y };
      }

      const KEYS = {
        ArrowUp: [0, -1], w: [0, -1], W: [0, -1],
        ArrowDown: [0, 1], s: [0, 1], S: [0, 1],
        ArrowLeft: [-1, 0], a: [-1, 0], A: [-1, 0],
        ArrowRight: [1, 0], d: [1, 0], D: [1, 0],
      };
      document.addEventListener("keydown", (e) => {
        if (e.key === " ") { e.preventDefault(); running ? togglePause() : start(); return; }
        const k = KEYS[e.key];
        if (k && running && !paused) { e.preventDefault(); turn(k[0], k[1]); }
      });

      let sx, sy;
      canvas.addEventListener("touchstart", (e) => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
      canvas.addEventListener("touchend", (e) => {
        const dx = e.changedTouches[0].clientX - sx;
        const dy = e.changedTouches[0].clientY - sy;
        if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
        if (Math.abs(dx) > Math.abs(dy)) turn(Math.sign(dx), 0);
        else turn(0, Math.sign(dy));
      });

      startBtn.addEventListener("click", start);
      pauseBtn.addEventListener("click", togglePause);

      reset();
      overlay("贪吃蛇 Neo", "点击「开始游戏」或按空格开始");
    })();
  </script>
</body>
</html>
