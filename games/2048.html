<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>2048 · LNF Commerce</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔢</text></svg>" />
  <link rel="stylesheet" href="../assets/css/style.css" />
  <style>
    .board {
      width: min(100%, 420px);
      aspect-ratio: 1;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      padding: 10px;
      border-radius: 14px;
      background: #3a3f5c;
      touch-action: none;
      user-select: none;
    }
    .cell {
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.08);
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: clamp(18px, 6vw, 32px);
      color: #fff;
      transition: background 0.12s;
    }
    .cell.pop { animation: pop 0.15s ease; }
    @keyframes pop { 0% { transform: scale(0.6); } 100% { transform: scale(1); } }
  </style>
</head>
<body class="play-page">
  <header class="nav">
    <div class="container nav-inner">
      <a href="../index.html" class="logo"><span class="logo-mark">LNF</span><span class="logo-text">LNF Commerce</span></a>
      <div class="nav-actions">
        <a class="btn btn-ghost btn-sm" href="../index.html#catalog-section">← 返回作品库</a>
        <button class="icon-btn" id="themeBtn" aria-label="切换主题">☀️</button>
      </div>
    </div>
  </header>

  <main class="play-main">
    <div class="container">
      <div class="play-head">
        <div><h1>🔢 2048</h1><p>相同数字碰撞合并，拼出 2048 方块！</p></div>
        <div class="scoreboard">
          <div class="score"><small>得分</small><b id="score">0</b></div>
          <div class="score"><small>最高</small><b id="best">0</b></div>
        </div>
      </div>
      <div class="stage"><div class="board" id="board"></div></div>
      <div class="controls">
        <button class="btn btn-primary" id="newBtn">新游戏</button>
        <button class="btn btn-ghost" id="undoBtn">撤销一步</button>
      </div>
      <p class="help">电脑：方向键 / WASD · 手机：在棋盘上滑动</p>
    </div>
  </main>

  <script src="../assets/js/main.js"></script>
  <script>
    (function () {
      const COLORS = {
        2: "#5b6a9c", 4: "#6a5cff", 8: "#ff9a5c", 16: "#ff7a45", 32: "#ff5c7a", 64: "#ff3d5c",
        128: "#20d3c2", 256: "#1fbfa5", 512: "#14a38c", 1024: "#ffb547", 2048: "#ffd447",
      };
      const boardEl = document.getElementById("board");
      const scoreEl = document.getElementById("score");
      const bestEl = document.getElementById("best");
      let grid, score, history, won;
      let best = Number(LNF.store.get("lnf-2048-best") || 0);
      bestEl.textContent = best;

      const cells = [];
      for (let i = 0; i < 16; i++) {
        const c = document.createElement("div");
        c.className = "cell";
        boardEl.appendChild(c);
        cells.push(c);
      }

      function addRandom() {
        const empty = [];
        grid.forEach((v, i) => { if (!v) empty.push(i); });
        if (!empty.length) return -1;
        const i = empty[Math.floor(Math.random() * empty.length)];
        grid[i] = Math.random() < 0.9 ? 2 : 4;
        return i;
      }

      function render(newIdx) {
        grid.forEach((v, i) => {
          const c = cells[i];
          c.textContent = v || "";
          c.style.background = v ? (COLORS[v] || "#ffd447") : "";
          c.style.fontSize = v >= 1024 ? "clamp(14px,4.5vw,24px)" : "";
          c.classList.toggle("pop", i === newIdx);
        });
        scoreEl.textContent = score;
        if (score > best) {
          best = score;
          bestEl.textContent = best;
          LNF.store.set("lnf-2048-best", best);
        }
      }

      function newGame() {
        grid = Array(16).fill(0);
        score = 0;
        history = [];
        won = false;
        addRandom();
        render(addRandom());
      }

      // 把一行向左压缩合并，返回新行与得分
      function slide(row) {
        const nums = row.filter(Boolean);
        let gained = 0;
        for (let i = 0; i < nums.length - 1; i++) {
          if (nums[i] === nums[i + 1]) {
            nums[i] *= 2;
            gained += nums[i];
            nums.splice(i + 1, 1);
          }
        }
        while (nums.length < 4) nums.push(0);
        return { row: nums, gained };
      }

      // dir: 0 左 1 右 2 上 3 下
      function lineIdx(dir, k) {
        const idx = [];
        for (let j = 0; j < 4; j++) {
          if (dir === 0) idx.push(k * 4 + j);
          if (dir === 1) idx.push(k * 4 + (3 - j));
          if (dir === 2) idx.push(j * 4 + k);
          if (dir === 3) idx.push((3 - j) * 4 + k);
        }
        return idx;
      }

      function move(dir) {
        const before = grid.slice();
        let gained = 0;
        for (let k = 0; k < 4; k++) {
          const idx = lineIdx(dir, k);
          const res = slide(idx.map((i) => grid[i]));
          idx.forEach((i, j) => (grid[i] = res.row[j]));
          gained += res.gained;
        }
        if (before.every((v, i) => v === grid[i])) return;
        history.push({ grid: before, score });
        if (history.length > 20) history.shift();
        score += gained;
        render(addRandom());

        if (!won && grid.includes(2048)) {
          won = true;
          LNF.toast("🎉 恭喜拼出 2048！可以继续挑战更高分");
        } else if (!canMove()) {
          LNF.toast(`游戏结束，得分 ${score}`);
        }
      }

      function canMove() {
        if (grid.includes(0)) return true;
        for (let i = 0; i < 16; i++) {
          if (i % 4 < 3 && grid[i] === grid[i + 1]) return true;
          if (i < 12 && grid[i] === grid[i + 4]) return true;
        }
        return false;
      }

      const KEYS = { ArrowLeft: 0, a: 0, A: 0, ArrowRight: 1, d: 1, D: 1, ArrowUp: 2, w: 2, W: 2, ArrowDown: 3, s: 3, S: 3 };
      document.addEventListener("keydown", (e) => {
        if (e.key in KEYS) { e.preventDefault(); move(KEYS[e.key]); }
      });

      let sx, sy;
      boardEl.addEventListener("touchstart", (e) => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
      boardEl.addEventListener("touchend", (e) => {
        const dx = e.changedTouches[0].clientX - sx;
        const dy = e.changedTouches[0].clientY - sy;
        if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
        if (Math.abs(dx) > Math.abs(dy)) move(dx < 0 ? 0 : 1);
        else move(dy < 0 ? 2 : 3);
      });

      document.getElementById("newBtn").addEventListener("click", newGame);
      document.getElementById("undoBtn").addEventListener("click", () => {
        const last = history.pop();
        if (!last) return LNF.toast("没有可以撤销的步骤");
        grid = last.grid;
        score = last.score;
        render(-1);
      });

      newGame();
    })();
  </script>
</body>
</html>
